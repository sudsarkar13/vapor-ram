[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vapor-ram"
version = "1.0.7-alpha.6"
description = "Ultra-Low RAM SSD Streaming Engine for google/gemma-4-E4B-it (< 1.5 GB RAM)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Sudeepta Sarkar (sudsarkar13)", email = "sudsarkar13@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.20.0",
    "llama-cpp-python>=0.2.0"
]

[project.scripts]
vapor = "vapor_ram.cli:main"

[project.urls]
Homepage = "https://github.com/sudsarkar13/vapor-ram"
Repository = "https://github.com/sudsarkar13/vapor-ram"
"Bug Tracker" = "https://github.com/sudsarkar13/vapor-ram/issues"
Changelog = "https://github.com/sudsarkar13/vapor-ram/blob/main/CHANGELOG.md"
